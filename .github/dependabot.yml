version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "3bdelrahmanashraf"
    assignees:
      - "3bdelrahmanashraf"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      development-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "typescript*"
          - "vitest*"
          - "tsup*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "@octokit/*"
          - "better-sqlite3"
          - "keytar"
          - "zod"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "3bdelrahmanashraf"
    labels:
      - "dependencies"
      - "github-actions"